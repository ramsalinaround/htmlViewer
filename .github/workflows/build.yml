name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project HTMLViewer.xcodeproj \
            -scheme HTMLViewer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA for sideloading
        run: |
          xcodebuild build \
            -project HTMLViewer.xcodeproj \
            -scheme HTMLViewer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/HTMLViewer.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../HTMLViewer-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTMLViewer-unsigned-ipa
          path: build/HTMLViewer-unsigned.ipa
